<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #container div{
        border: 2px solid black;
        width: 300px;
    }

    img{
        width: 100px;
        height: 100px;
    }
</style>
<body>
    <div id="container">
        <h1>Products</h1> 
        <div class="product">
            <h2>Book</h2>
            <p>$7.99</p>
            <img src="book.jpg" alt="book.jpg">
            <button>Add to cart</button>
        </div>

        <div class="product">
            <h2>Notebook</h2>
            <p>$2.99</p>
            <img src="notebook.jpg" alt="notebook.jpg">
            <button>Add to cart</button>
        </div>

        <div class="product">
            <h2>Pen</h2>
            <p>$0.99</p>
            <img src="pen.jpg" alt="pen.jpg">
            <button>Add to cart</button>
        </div>

        <div class="product">
            <h2>Pencil</h2>
            <p>$0.99</p>
            <img src="pencil.jpg" alt="pencil.jpg">
            <button>Add to cart</button>
        </div>

        <div class="product">
            <h2>Sharpener</h2>
            <p>$1.99</p>
            <img src="sharpener.jpg" alt="sharpener.jpg">
            <button>Add to cart</button>
        </div>

        <div class="product">
            <h2>Eraser</h2>
            <p>$1.99</p>
            <img src="eraser.jpg" alt="eraser.jpg">
            <button>Add to cart</button>
        </div>

        <div class="product">
            <h2>Ruler</h2>
            <p>$1.99</p>
            <img src="ruler.jpg" alt="ruler.jpg">
            <button>Add to cart</button>
        </div>

        <div id="cart">
            <h2>Cart:</h2>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
