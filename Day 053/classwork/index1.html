<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <h3>Your Result</h3>

            <div class="circle">
                <h1>76</h1>
                <p>of 100</p>
            </div>

            <h2>Great</h2>
            <p class="text">
                You scored higher than 65% of the people who have taken these tests.
            </p>
        </div>

        <div class="right">
            <h2>Summary</h2>

            <div class="item-reaction">
                <img src="./icon-reaction.svg">
                <span>Reaction</span>
                <span><b>80</b> / 100</span>
            </div>

            <div class="item-memory">
                <img src="./icon-memory.svg">
                <span>Memory</span>
                <span><b>92</b> / 100</span>
            </div>

            <div class="item-verbal">
                <img src="./icon-verbal.svg">
                <span>Verbal</span>
                <span><b>61</b> / 100</span>
            </div>

            <div class="item-visual">
                <img src="./icon-visual.svg">
                <span>Visual</span>
                <span><b>73</b> / 100</span>
            </div>

            <button>Continue</button>
        </div>
    </div>
</body>
</html>
